version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: lenny-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lenny_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenny_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lenny-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/lenny_assistant
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ALLOW_MOCK_FALLBACK=true
      - DATA_DIR=/app/data
      - FIXTURES_DIR=/app/data/fixtures
    ports:
      - "8000:8000"
    extra_hosts:
      # Allows backend container to communicate with Ollama running natively on the host machine
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
